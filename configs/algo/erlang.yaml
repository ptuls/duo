name: erlang_mdlm
backbone: dit  # The augmented phase-embedding path is implemented for DiT.
parameterization: subs
time_conditioning: True
T: 0  # continuous time
subs_masking: False
causal_attention: False
ignore_bos: False
loss_type: elbo

# Semi-Markov (Erlang-k) masking: number of sequential exponential stages.
# k=1 recovers the standard absorbing process and objective. For k>1, visible
# tokens carry a learned phase embedding until the final transition to [MASK].
# Ablate k in {1, 2, 4, 8}.
erlang_k: 2
